hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# 自定义trainer配置
trainer:
  custom_class_path: "deep_research.dr_ray_trainer.DrRayPPOTrainer"

reward_model:
  reward_kwargs:
    reward_manager_class_path: "deep_research.reward.antfin_reward_manager.AntfinRewardManager"
    # 异步模式配置：true=异步模式，false=同步模式，需要与训练脚本中的custom_reward_function.name=compute_score_async对应
    async_mode: true
    # 异步模式的超时时间（秒）
    timeout: 300.0
    # 同步模式的最大工作线程数
    max_workers: 8

