# Synthesis V2 - local Mac + DSW proxy (39.106.32.151:8003)
#
# Usage:
#   export SYNTHESIS_V2_CONFIG=deep_research/synthesis_v2/config/synthesis_v2_dsw_proxy.yaml
#   export OPENAI_API_KEY="sk-..."
#   python -m deep_research.synthesis_v2.example_usage
#
# Solver + reviser -> http://39.106.32.151:8003/v1 (gpt-5.4)
# Reward (OpenJudge) -> reward_function.init_params.base_url (DashScope)

concurrency:
  max_workers: 32

batch_processor:
  batch_size: 10
  best_of_n: 1

writer:
  output_dir: "outputs/synthesis_v2"

openai_api:
  api_key: null
  base_url: "http://39.106.32.151:8003/v1"
  prefer_json_mode: true
  timeout: 180
  max_retries: 3
  rate_limit_max_retries: 3
  rate_limit_initial_wait: 10
  rate_limit_max_wait: 120
  default_model_name: "openai.gpt-5.4-2026-03-05"
  default_temperature: 0.7
  default_top_p: 0.9
  default_top_k: null
  default_max_tokens: 64000

multi_turn:
  max_turns: 20
  format: "hermes"
  completion_callback: "deep_research.synthesis.core.dr_synthesis_completion_callback.DrSynthesisCompletionCallback"
  tool_config_path: "deep_research/config/tool_config/google_jina.yaml"

query_generation:
  num_queries_per_batch: 10
  max_queries_per_call: 20
  max_concurrent_generation: 5
  model_name: "openai.gpt-5.4-2026-03-05"
  api_key: null
  base_url: "http://39.106.32.151:8003/v1"
  temperature: 0.9
  top_p: 0.9
  top_k: null
  max_tokens: null

generation:
  rollout_n: 1
  trajectory_prompt_template_path: "deep_research/synthesis_v2/prompts/trajectory_generate_prompt_general_search.py"
  inject_mermaid_in_prompt: false
  max_concurrent_trajectories: 5
  model_name: "openai.gpt-5.4-2026-03-05"
  api_key: null
  base_url: "http://39.106.32.151:8003/v1"
  temperature: null
  top_p: null
  top_k: null
  max_tokens: 65536

orm:
  enabled: true

reward_function:
  class_path: "deep_research.reward.openjudge_reward_function.OpenJudgeRewardFunction"
  init_params:
    model_name: "qwen3.6-plus"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: null
    temperature: 0.0
    language: "en"
    max_concurrency: 32
    show_progress: true
    rubrics_only: true
    grader_weights:
      rubrics_based_trajectory_performance: 0.2

quality_control:
  quality_threshold: 0.0

complexity_exploration:
  max_iterations: 30
  reviser:
    model_name: "openai.gpt-5.4-2026-03-05"
    api_key: null
    base_url: "http://39.106.32.151:8003/v1"
    prefer_json_mode: true
    temperature: 0.8
    top_p: null
    top_k: null
    max_tokens: null
  output_dir: "outputs/complexity_exploration"
