# Synthesis V2 - vLLM(OpenAI兼容) 远程部署配置示例
#
# 用法：
# - 启动 vLLM server（示例）：
#   python -m vllm.entrypoints.openai.api_server \
#     --model /path/to/ckpt \
#     --served-model-name qwen3-32b-sft \
#     --port 8000 \
#     --max-model-len 8192 \
#     --gpu-memory-utilization 0.9 \
#     --enable-auto-tool-choice \
#     --tool-call-parser pythonic \
#     --trust-remote-code
#
# - 运行 example_usage 时指定该配置：
#   SYNTHESIS_V2_CONFIG=deep_research/synthesis_v2/config/synthesis_v2_vllm.yaml python -m deep_research.synthesis_v2.example_usage
#
# 说明：
# - vLLM 默认不校验 api_key，但本项目的 OpenAI SDK client 需要非空 key，因此给一个占位符即可。
# - base_url 必须以 /v1 结尾（OpenAI SDK 会在其后拼接 /chat/completions）。

concurrency:
  max_workers: 32

batch_processor:
  batch_size: 10
  best_of_n: 3

writer:
  output_dir: "outputs/synthesis_v2"
  save_all_results: true
  save_format: "jsonl"

openai_api:
  api_key: "token-abc123"
  # TODO: 替换成你的远程地址，如 "http://10.0.0.12:8000/v1"
  base_url: "http://127.0.0.1:8000/v1"
  organization: null
  timeout: 180
  max_retries: 0

  rate_limit_max_retries: 3
  rate_limit_initial_wait: 2
  rate_limit_max_wait: 30

  # 这里必须与 vLLM 的 --served-model-name 一致
  default_model_name: "qwen3-32b-sft"
  default_temperature: 0.7
  default_top_p: 0.9
  default_top_k: null
  default_max_tokens: 2048

multi_turn:
  enable: true
  max_turns: 20
  # 工具调用格式：你当前配置是 hermes；若你的训练/模板更贴近其它格式，可调整，但多数情况下无需改。
  format: "hermes"
  completion_callback: "deep_research.synthesis.core.dr_synthesis_completion_callback.DrSynthesisCompletionCallback"
  tool_config_path: "deep_research/config/tool_config/normal.yaml"

query_generation:
  num_queries: 50
  num_queries_per_batch: 10
  max_queries_per_call: 20
  max_concurrent_generation: 5
  model_name: null
  api_key: null
  base_url: null
  temperature: 0.9
  top_p: 0.9
  top_k: null
  max_tokens: null

skeleton:
  prompt_template_path: "deep_research/synthesis/prompts/skeleton_generate_prompt.py"
  max_steps: 5
  validation_enabled: true
  max_parse_retries: 5
  max_concurrent_skeletons: 3
  model_name: null
  api_key: null
  base_url: null
  temperature: null
  top_p: null
  top_k: null
  max_tokens: null

generation:
  rollout_n: 1
  trajectory_prompt_template_path: "deep_research/synthesis/prompts/trajectory_generate_prompt_general_search_en.py"
  max_concurrent_trajectories: 5
  model_name: null
  api_key: null
  base_url: null
  temperature: null
  top_p: null
  top_k: null
  # 你的 vLLM max_model_len=8192 时，建议把这里也收敛到 8k 左右，避免请求过大导致 400/截断
  max_tokens: 8192

orm:
  enabled: true

reward_function:
  class_path: 'deep_research.reward.openjudge_reward_function.OpenJudgeRewardFunction'
  init_params:
    model_name: "qwen3-32b-sft"
    temperature: 0.0
    language: "en"
    max_concurrency: 32
    show_progress: true
    rubrics_only: true
    grader_weights:
      rubrics_based_trajectory_performance: 0.2

quality_control:
  min_skeleton_steps: 1
  max_skeleton_steps: 5
  min_trajectory_turns: 2
  max_trajectory_turns: 25
  filter_invalid_trajectories: true
  filter_low_quality_trajectories: true
  quality_threshold: 0.0

complexity_exploration:
  enabled: false
  max_iterations: 10
  quality_scoring:
    strategy: "average"
    dimensions: [financial_resolution_reward, rubrics_reward]
    weights: {}
    use_rubrics_in_quality: false
  quality_threshold: 0.7
  judgment_mode: "above_threshold"
  min_complexity_increase: 0.1
  reviser:
    prompt_template_path: "deep_research/synthesis/prompts/query_revise_prompt.py"
    model_name: null
    api_key: null
    base_url: null
    temperature: 0.8
    top_p: null
    top_k: null
    max_tokens: null
  rubrics_evaluation:
    enabled: true
    model_name: null
    api_key: null
    base_url: null
    temperature: 0.3
    top_p: null
    top_k: null
    max_tokens: null
  max_concurrent_explorations: 4
  save_all_iterations: true
  output_dir: "outputs/complexity_exploration"

input:
  queries_file: ""
  batch_size: 1
  max_data_count: null

output:
  generated_queries_dir: "outputs/generated_queries"
  skeleton_dir: "outputs/skeletons"
  trajectory_dir: "outputs/trajectories"
  log_dir: "outputs/logs"
  save_intermediate: true
  save_training_data: false
  export_format: "jsonl"

experiment:
  name: "synthesis_v2_experiment"
  logging_level: "INFO"
  save_detailed_logs: true

